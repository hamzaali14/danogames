<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trivia Quiz — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<script src="../shared.js" defer></script>
<style>
  #panel { width: min(92vw, 420px); display: flex; flex-direction: column; gap: 16px; }
  #qCategory { font-size: 12px; color: #9295ad; font-weight: 700; text-transform: uppercase; text-align: center; }
  #qText { font-size: 19px; font-weight: 700; text-align: center; min-height: 56px; }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    padding: 14px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: #171826; color: #f2f3f8; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: center;
  }
  .choice.correct { background: #1c4d3a; border-color: #34d399; color: #34d399; }
  .choice.wrong { background: #4a1f2b; border-color: #ff5c7c; color: #ff5c7c; }
  .choice:disabled { cursor: default; }
  #barTrack { height: 6px; background: #1e2032; border-radius: 3px; overflow: hidden; }
  #barFill { height: 100%; background: linear-gradient(90deg, #a855f7, #ff4fd8); width: 100%; }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">🧠 Trivia Quiz</div>
    <div class="g-stats">Score <b id="score">0</b> Best <b id="best">0</b> Q <b id="qnum">1</b>/10</div>
    <button class="g-btn ghost" id="restart">Restart</button>
  </div>
  <div class="g-stage">
    <div id="panel">
      <div id="barTrack"><div id="barFill"></div></div>
      <div id="qCategory">General</div>
      <div id="qText">Loading...</div>
      <div id="choices"></div>
    </div>
    <div class="g-overlay" id="overlay">
      <h2 id="overTitle">Quiz Complete!</h2>
      <p id="overMsg"></p>
      <button class="g-btn" id="again">Play Again</button>
    </div>
  </div>
  <div class="g-hint">Pick the correct answer before the timer runs out · 10 questions</div>
</div>
<script>
(function(){
  const BANK = [
    { cat: 'Geography', q: 'What is the capital of Australia?', choices: ['Sydney','Canberra','Melbourne','Perth'], a: 1 },
    { cat: 'Geography', q: 'Which is the longest river in the world?', choices: ['Amazon','Nile','Yangtze','Mississippi'], a: 1 },
    { cat: 'Geography', q: 'Mount Everest is located in which mountain range?', choices: ['Andes','Alps','Himalayas','Rockies'], a: 2 },
    { cat: 'Geography', q: 'Which country has the most natural lakes?', choices: ['USA','Canada','Russia','Finland'], a: 1 },
    { cat: 'Geography', q: 'What is the smallest country in the world?', choices: ['Monaco','San Marino','Vatican City','Liechtenstein'], a: 2 },
    { cat: 'Geography', q: 'The Sahara Desert is located on which continent?', choices: ['Asia','Africa','Australia','South America'], a: 1 },
    { cat: 'Geography', q: 'Which ocean is the largest?', choices: ['Atlantic','Indian','Arctic','Pacific'], a: 3 },
    { cat: 'Geography', q: 'What is the capital of Japan?', choices: ['Osaka','Kyoto','Tokyo','Nagoya'], a: 2 },
    { cat: 'Science', q: 'What is the chemical symbol for gold?', choices: ['Go','Gd','Au','Ag'], a: 2 },
    { cat: 'Science', q: 'How many planets are in our solar system?', choices: ['7','8','9','10'], a: 1 },
    { cat: 'Science', q: 'What gas do plants primarily absorb from the atmosphere?', choices: ['Oxygen','Nitrogen','Carbon Dioxide','Hydrogen'], a: 2 },
    { cat: 'Science', q: 'What is the powerhouse of the cell?', choices: ['Nucleus','Ribosome','Mitochondria','Golgi Body'], a: 2 },
    { cat: 'Science', q: 'What is the speed of light approximately?', choices: ['300,000 km/s','150,000 km/s','1,000,000 km/s','30,000 km/s'], a: 0 },
    { cat: 'Science', q: 'Which planet is known as the Red Planet?', choices: ['Venus','Mars','Jupiter','Saturn'], a: 1 },
    { cat: 'Science', q: 'What is H2O more commonly known as?', choices: ['Salt','Water','Sugar','Oxygen'], a: 1 },
    { cat: 'Science', q: 'What force keeps us grounded on Earth?', choices: ['Magnetism','Friction','Gravity','Inertia'], a: 2 },
    { cat: 'History', q: 'In which year did World War II end?', choices: ['1943','1945','1947','1950'], a: 1 },
    { cat: 'History', q: 'Who was the first President of the United States?', choices: ['Thomas Jefferson','Abraham Lincoln','George Washington','John Adams'], a: 2 },
    { cat: 'History', q: 'The Great Wall is located in which country?', choices: ['India','China','Japan','Mongolia'], a: 1 },
    { cat: 'History', q: 'Which ancient civilization built the pyramids of Giza?', choices: ['Romans','Greeks','Egyptians','Persians'], a: 2 },
    { cat: 'History', q: 'The Titanic sank in which year?', choices: ['1905','1912','1920','1931'], a: 1 },
    { cat: 'History', q: 'Who painted the Mona Lisa?', choices: ['Michelangelo','Da Vinci','Raphael','Donatello'], a: 1 },
    { cat: 'Pop Culture', q: 'Which planet is Superman originally from?', choices: ['Mars','Krypton','Namek','Vulcan'], a: 1 },
    { cat: 'Pop Culture', q: 'How many strings does a standard guitar have?', choices: ['4','5','6','7'], a: 2 },
    { cat: 'Pop Culture', q: 'What color do you get by mixing blue and yellow?', choices: ['Purple','Orange','Green','Brown'], a: 2 },
    { cat: 'Pop Culture', q: 'Which instrument has 88 keys?', choices: ['Organ','Piano','Accordion','Harpsichord'], a: 1 },
    { cat: 'Sports', q: 'How many players are on a standard soccer team on the field?', choices: ['9','10','11','12'], a: 2 },
    { cat: 'Sports', q: 'In which sport would you perform a slam dunk?', choices: ['Volleyball','Basketball','Tennis','Badminton'], a: 1 },
    { cat: 'Sports', q: 'How often are the Summer Olympic Games held?', choices: ['Every 2 years','Every 4 years','Every 5 years','Every 3 years'], a: 1 },
    { cat: 'Sports', q: 'What sport uses a shuttlecock?', choices: ['Tennis','Squash','Badminton','Table Tennis'], a: 2 },
    { cat: 'General', q: 'How many continents are there?', choices: ['5','6','7','8'], a: 2 },
    { cat: 'General', q: 'How many sides does a hexagon have?', choices: ['5','6','7','8'], a: 1 },
    { cat: 'General', q: 'What is the largest mammal in the world?', choices: ['Elephant','Blue Whale','Giraffe','Polar Bear'], a: 1 },
    { cat: 'General', q: 'How many colors are in a rainbow?', choices: ['5','6','7','8'], a: 2 },
    { cat: 'General', q: 'What is the freezing point of water in Celsius?', choices: ['0°C','32°C','100°C','-10°C'], a: 0 },
    { cat: 'General', q: 'Which is the largest organ in the human body?', choices: ['Heart','Liver','Skin','Brain'], a: 2 },
    { cat: 'General', q: 'How many legs does a spider have?', choices: ['6','8','10','12'], a: 1 },
    { cat: 'General', q: 'What is the tallest animal in the world?', choices: ['Elephant','Giraffe','Ostrich','Horse'], a: 1 },
    { cat: 'General', q: 'How many bones are in the adult human body?', choices: ['186','206','226','246'], a: 1 },
    { cat: 'General', q: 'What is the currency of Japan?', choices: ['Won','Yuan','Yen','Ringgit'], a: 2 }
  ];

  const TIME_PER_Q = 12000;
  let round, index, score, best, streak, timerStart, timerId, answered;
  best = parseInt(localStorage.getItem('dg_trivia_best') || '0');
  document.getElementById('best').textContent = best;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function reset() {
    round = shuffle(BANK).slice(0, 10);
    index = 0; score = 0; streak = 0;
    document.getElementById('score').textContent = score;
    document.getElementById('overlay').classList.remove('show');
    showQuestion();
  }

  function showQuestion() {
    answered = false;
    document.getElementById('qnum').textContent = index + 1;
    const q = round[index];
    document.getElementById('qCategory').textContent = q.cat;
    document.getElementById('qText').textContent = q.q;
    const shuffledChoices = q.choices.map((c, i) => ({ c, i })).sort(() => Math.random() - 0.5);
    const choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    shuffledChoices.forEach(({ c, i }) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = c;
      btn.addEventListener('click', () => selectAnswer(i, btn));
      choicesEl.appendChild(btn);
    });
    timerStart = performance.now();
    clearInterval(timerId);
    timerId = setInterval(updateBar, 50);
  }

  function updateBar() {
    const elapsed = performance.now() - timerStart;
    const pct = Math.max(0, 100 - (elapsed / TIME_PER_Q) * 100);
    document.getElementById('barFill').style.width = pct + '%';
    if (pct <= 0) { clearInterval(timerId); selectAnswer(-1); }
  }

  function selectAnswer(choiceIndex, btnEl) {
    if (answered) return;
    answered = true;
    clearInterval(timerId);
    const q = round[index];
    const buttons = Array.from(document.getElementById('choices').children);
    buttons.forEach(b => {
      b.disabled = true;
      if (b.textContent === q.choices[q.a]) b.classList.add('correct');
    });
    if (choiceIndex === q.a) {
      streak++;
      score += 10 + streak * 2;
      document.getElementById('score').textContent = score;
    } else {
      streak = 0;
      if (btnEl) btnEl.classList.add('wrong');
    }
    setTimeout(next, 1100);
  }

  function next() {
    index++;
    if (index >= round.length) return finish();
    showQuestion();
  }

  function finish() {
    if (score > best) { best = score; localStorage.setItem('dg_trivia_best', best); document.getElementById('best').textContent = best; }
    document.getElementById('overMsg').textContent = 'Score: ' + score + (score >= best ? ' — New best!' : '');
    document.getElementById('overlay').classList.add('show');
  }

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
