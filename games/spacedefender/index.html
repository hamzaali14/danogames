<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Space Defender — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<style>
  .g-stage { background: #0e0f1a; }
  #board { background: #0a0b14; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">👾 Space Defender</div>
    <div class="g-stats">Score <b id="score">0</b> Best <b id="best">0</b> Lives <b id="lives">3</b></div>
    <button class="g-btn ghost" id="restart">Restart</button>
  </div>
  <div class="g-stage">
    <canvas id="board" width="420" height="480"></canvas>
    <div class="g-overlay" id="overlay">
      <h2 id="overTitle">Game Over</h2>
      <p id="overMsg">Score: 0</p>
      <button class="g-btn" id="again">Play Again</button>
    </div>
  </div>
  <div class="g-hint">Arrow keys / A-D or drag to move · Space or tap to shoot</div>
</div>
<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  let ship, bullets, enemies, enemyDir, score, best, lives, running, wave, keys = {}, fireCooldown;

  best = parseInt(localStorage.getItem('dg_spacedefender_best') || '0');
  document.getElementById('best').textContent = best;

  function reset() {
    ship = { x: W/2 - 18, y: H - 46, w: 36, h: 22 };
    bullets = [];
    score = 0; lives = 3; wave = 1; running = true; fireCooldown = 0;
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    document.getElementById('overlay').classList.remove('show');
    spawnWave();
    loop();
  }

  function spawnWave() {
    enemies = [];
    const cols = 7, rows = 4;
    const gapX = 42, gapY = 40, startX = (W - (cols-1)*gapX) / 2, startY = 40;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push({ x: startX + c*gapX, y: startY + r*gapY, alive: true, row: r });
      }
    }
    enemyDir = 1;
    enemySpeed = 0.6 + wave*0.15;
  }
  let enemySpeed = 0.6;

  function loop() {
    if (!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function update() {
    if (keys.left) ship.x -= 5.5;
    if (keys.right) ship.x += 5.5;
    ship.x = Math.max(0, Math.min(W - ship.w, ship.x));

    if (fireCooldown > 0) fireCooldown--;
    if (keys.fire && fireCooldown <= 0) {
      bullets.push({ x: ship.x + ship.w/2 - 2, y: ship.y, w: 4, h: 10 });
      fireCooldown = 14;
    }

    bullets.forEach(b => b.y -= 8);
    bullets = bullets.filter(b => b.y > -20);

    let hitEdge = false;
    enemies.forEach(en => {
      if (!en.alive) return;
      en.x += enemyDir * enemySpeed;
      if (en.x < 10 || en.x > W - 30) hitEdge = true;
    });
    if (hitEdge) {
      enemyDir *= -1;
      enemies.forEach(en => en.y += 14);
    }

    bullets.forEach(b => {
      enemies.forEach(en => {
        if (en.alive && b.x < en.x+24 && b.x+b.w > en.x && b.y < en.y+18 && b.y+b.h > en.y) {
          en.alive = false;
          b.y = -999;
          score += 10;
          document.getElementById('score').textContent = score;
        }
      });
    });
    bullets = bullets.filter(b => b.y > -100);

    enemies.forEach(en => {
      if (en.alive && en.y + 18 >= ship.y) {
        en.alive = false;
        loseLife();
      }
    });

    if (enemies.every(en => !en.alive)) {
      wave++;
      spawnWave();
    }
  }

  function loseLife() {
    lives--;
    document.getElementById('lives').textContent = lives;
    if (lives <= 0) endGame();
  }

  function endGame() {
    running = false;
    if (score > best) { best = score; localStorage.setItem('dg_spacedefender_best', best); document.getElementById('best').textContent = best; }
    document.getElementById('overTitle').textContent = 'Game Over';
    document.getElementById('overMsg').textContent = 'Score: ' + score + (score >= best && score > 0 ? ' — New best!' : '');
    document.getElementById('overlay').classList.add('show');
  }

  function draw() {
    ctx.fillStyle = '#0a0b14';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#a855f7';
    ctx.beginPath();
    ctx.moveTo(ship.x + ship.w/2, ship.y);
    ctx.lineTo(ship.x, ship.y + ship.h);
    ctx.lineTo(ship.x + ship.w, ship.y + ship.h);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ff4fd8';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    enemies.forEach(en => {
      if (!en.alive) return;
      ctx.fillStyle = ['#34d399','#22d3ee','#f5a524','#ff5c7c'][en.row % 4];
      ctx.fillRect(en.x, en.y, 24, 18);
      ctx.fillStyle = '#0a0b14';
      ctx.fillRect(en.x+5, en.y+5, 4, 4);
      ctx.fillRect(en.x+15, en.y+5, 4, 4);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
    if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === ' ') keys.fire = false;
  });

  let touchStartX = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    keys.fire = true;
  }, {passive:true});
  canvas.addEventListener('touchmove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    const dx = (e.touches[0].clientX - touchStartX) * scale;
    ship.x = Math.max(0, Math.min(W - ship.w, ship.x + dx));
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  canvas.addEventListener('touchend', () => { keys.fire = false; }, {passive:true});

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
