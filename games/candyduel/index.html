<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Candy Duel — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<script src="../shared.js" defer></script>
<style>
  #board {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
    width: min(92vw, 380px); aspect-ratio: 1; background: #171826; padding: 6px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
  }
  .candy {
    border-radius: 8px; cursor: pointer; transition: transform .1s ease;
    display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 3.6vw, 22px);
  }
  .candy.sel { outline: 3px solid #f2f3f8; outline-offset: -3px; transform: scale(0.9); }
  #vsRow { display: flex; gap: 10px; width: min(92vw, 380px); margin-bottom: 4px; }
  .vsCard {
    flex: 1; background: #171826; border-radius: 10px; padding: 8px 10px; text-align: center;
    border: 2px solid transparent; transition: border-color .2s ease;
  }
  .vsCard.active { border-color: #a855f7; background: #1e2032; }
  .vsCard .name { font-size: 12px; color: #9295ad; font-weight: 700; text-transform: uppercase; }
  .vsCard .val { font-size: 22px; font-weight: 800; }
  #modeChoice { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: center; }
  #modeChoice button { width: 100%; max-width: 280px; }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">🍬 Candy Duel</div>
    <div class="g-stats">Turn <b id="turnNum">1</b>/<b id="turnTotal">20</b></div>
    <button class="g-btn ghost" id="restart">New Match</button>
  </div>
  <div class="g-stage">
    <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div id="vsRow">
        <div class="vsCard" id="p1Card"><div class="name" id="p1Label">Player 1</div><div class="val" id="p1Score">0</div></div>
        <div class="vsCard" id="p2Card"><div class="name" id="p2Label">Computer</div><div class="val" id="p2Score">0</div></div>
      </div>
      <div id="board"></div>
    </div>
    <div class="g-overlay show" id="overlay">
      <h2 id="overTitle">Candy Duel</h2>
      <p id="overMsg">Match candies to score. Take turns — highest score after 20 turns wins!</p>
      <div id="modeChoice">
        <button class="g-btn" id="vsComputer">Play vs Computer</button>
        <button class="g-btn ghost" id="vsFriend">Play vs Friend (pass & play)</button>
      </div>
    </div>
  </div>
  <div class="g-hint">Tap two adjacent candies to swap · Match 3 or more · No score = no move, try again</div>
</div>
<script>
(function(){
  const ROWS = 8, COLS = 8, TURN_LIMIT = 20;
  const CANDIES = [
    { emoji: '🍬', bg: '#ff5c7c' },
    { emoji: '🍭', bg: '#22d3ee' },
    { emoji: '🍫', bg: '#8b5a2b' },
    { emoji: '🍩', bg: '#f5a524' },
    { emoji: '🍪', bg: '#c98a4b' },
    { emoji: '🧁', bg: '#a855f7' }
  ];
  const boardEl = document.getElementById('board');
  let grid, selected, mode, turnNum, currentPlayer, scores, busy, wins;

  wins = parseInt(localStorage.getItem('dg_candyduel_wins') || '0');

  function randCandy() { return Math.floor(Math.random() * CANDIES.length); }

  function generateGrid() {
    const g = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const avoid = new Set();
        if (c >= 2 && g[r][c-1] === g[r][c-2]) avoid.add(g[r][c-1]);
        if (r >= 2 && g[r-1][c] === g[r-2][c]) avoid.add(g[r-1][c]);
        let v;
        do { v = randCandy(); } while (avoid.has(v));
        g[r][c] = v;
      }
    }
    return g;
  }

  function findMatches(g) {
    const matched = new Set();
    for (let r = 0; r < ROWS; r++) {
      let run = 1;
      for (let c = 1; c <= COLS; c++) {
        if (c < COLS && g[r][c] === g[r][c-1]) run++;
        else { if (run >= 3) for (let k = c-run; k < c; k++) matched.add(r+','+k); run = 1; }
      }
    }
    for (let c = 0; c < COLS; c++) {
      let run = 1;
      for (let r = 1; r <= ROWS; r++) {
        if (r < ROWS && g[r][c] === g[r-1][c]) run++;
        else { if (run >= 3) for (let k = r-run; k < r; k++) matched.add(k+','+c); run = 1; }
      }
    }
    return matched;
  }

  function applyGravity(g) {
    for (let c = 0; c < COLS; c++) {
      const stack = [];
      for (let r = ROWS-1; r >= 0; r--) if (g[r][c] !== null) stack.push(g[r][c]);
      for (let r = ROWS-1; r >= 0; r--) g[r][c] = stack.length ? stack.shift() : randCandy();
    }
  }

  function cloneGrid(g) { return g.map(row => row.slice()); }

  function simulateSwapScore(g, r1, c1, r2, c2) {
    const sim = cloneGrid(g);
    const tmp = sim[r1][c1]; sim[r1][c1] = sim[r2][c2]; sim[r2][c2] = tmp;
    if (findMatches(sim).size === 0) return null;
    let total = 0, multiplier = 1;
    while (true) {
      const matches = findMatches(sim);
      if (matches.size === 0) break;
      matches.forEach(key => { const [r,c] = key.split(',').map(Number); sim[r][c] = null; });
      total += matches.size * 10 * multiplier;
      multiplier++;
      applyGravity(sim);
    }
    return total;
  }

  function getAllValidSwaps(g) {
    const swaps = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c < COLS-1) { const s = simulateSwapScore(g, r, c, r, c+1); if (s !== null) swaps.push({ r1:r, c1:c, r2:r, c2:c+1, score:s }); }
        if (r < ROWS-1) { const s = simulateSwapScore(g, r, c, r+1, c); if (s !== null) swaps.push({ r1:r, c1:c, r2:r+1, c2:c, score:s }); }
      }
    }
    return swaps;
  }

  function reset() {
    grid = null; selected = null; busy = false;
    document.getElementById('overTitle').textContent = 'Candy Duel';
    document.getElementById('overMsg').textContent = 'Match candies to score. Take turns — highest score after 20 turns wins!';
    document.getElementById('modeChoice').style.display = 'flex';
    document.getElementById('overlay').classList.add('show');
  }

  function startMatch(selectedMode) {
    mode = selectedMode;
    document.getElementById('p2Label').textContent = mode === 'ai' ? 'Computer' : 'Player 2';
    let g, tries = 0;
    do { g = generateGrid(); tries++; } while (getAllValidSwaps(g).length === 0 && tries < 20);
    grid = g;
    scores = { 1: 0, 2: 0 };
    turnNum = 1; currentPlayer = 1; selected = null; busy = false;
    document.getElementById('p1Score').textContent = 0;
    document.getElementById('p2Score').textContent = 0;
    document.getElementById('turnNum').textContent = turnNum;
    document.getElementById('turnTotal').textContent = TURN_LIMIT;
    document.getElementById('overlay').classList.remove('show');
    updateTurnUI();
    render();
  }

  function updateTurnUI() {
    document.getElementById('p1Card').classList.toggle('active', currentPlayer === 1);
    document.getElementById('p2Card').classList.toggle('active', currentPlayer === 2);
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

  async function resolveCascades() {
    let multiplier = 1, total = 0;
    while (true) {
      const matches = findMatches(grid);
      if (matches.size === 0) break;
      matches.forEach(key => { const [r,c] = key.split(',').map(Number); grid[r][c] = null; });
      render();
      await sleep(160);
      total += matches.size * 10 * multiplier;
      multiplier++;
      applyGravity(grid);
      render();
      await sleep(160);
    }
    return total;
  }

  async function endTurn(scoreGained) {
    scores[currentPlayer] += scoreGained;
    document.getElementById(currentPlayer === 1 ? 'p1Score' : 'p2Score').textContent = scores[currentPlayer];

    if (getAllValidSwaps(grid).length === 0) { grid = generateGrid(); render(); }

    if (turnNum >= TURN_LIMIT) { busy = false; return finish(); }
    turnNum++;
    document.getElementById('turnNum').textContent = turnNum;
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updateTurnUI();
    busy = false;

    if (mode === 'ai' && currentPlayer === 2) {
      await sleep(500);
      await aiTurn();
    }
  }

  async function aiTurn() {
    busy = true;
    const swaps = getAllValidSwaps(grid);
    if (swaps.length === 0) { busy = false; return endTurn(0); }
    const maxScore = Math.max(...swaps.map(s => s.score));
    const best = swaps.filter(s => s.score === maxScore);
    const pick = best[Math.floor(Math.random() * best.length)];
    const tmp = grid[pick.r1][pick.c1]; grid[pick.r1][pick.c1] = grid[pick.r2][pick.c2]; grid[pick.r2][pick.c2] = tmp;
    render();
    await sleep(300);
    const gained = await resolveCascades();
    await endTurn(gained);
  }

  function finish() {
    let title, msg;
    if (scores[1] === scores[2]) { title = "It's a Draw!"; }
    else if (mode === 'ai') {
      title = scores[1] > scores[2] ? 'You Win! 🎉' : 'Computer Wins';
      if (scores[1] > scores[2]) { wins++; localStorage.setItem('dg_candyduel_wins', wins); }
    } else {
      title = (scores[1] > scores[2] ? 'Player 1' : 'Player 2') + ' Wins! 🎉';
    }
    msg = 'Final score — ' + document.getElementById('p1Label').textContent + ': ' + scores[1] + ' · ' + document.getElementById('p2Label').textContent + ': ' + scores[2];
    document.getElementById('overTitle').textContent = title;
    document.getElementById('overMsg').textContent = msg;
    document.getElementById('modeChoice').style.display = 'none';
    let again = document.getElementById('playAgainBtn');
    if (!again) {
      again = document.createElement('button');
      again.className = 'g-btn';
      again.id = 'playAgainBtn';
      again.textContent = 'Play Again';
      again.addEventListener('click', reset);
      document.querySelector('#overlay').appendChild(again);
    }
    again.style.display = 'block';
    document.getElementById('overlay').classList.add('show');
  }

  async function trySwap(r1, c1, r2, c2) {
    busy = true;
    const tmp = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = tmp;
    render();
    await sleep(120);
    if (findMatches(grid).size === 0) {
      const tmp2 = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = tmp2;
      render();
      busy = false;
      return;
    }
    const gained = await resolveCascades();
    await endTurn(gained);
  }

  function cellClick(r, c) {
    if (busy) return;
    if (mode === 'ai' && currentPlayer === 2) return;
    if (!selected) { selected = [r, c]; render(); return; }
    const [sr, sc] = selected;
    if (sr === r && sc === c) { selected = null; render(); return; }
    const adjacent = (Math.abs(sr-r) + Math.abs(sc-c)) === 1;
    if (adjacent) { selected = null; trySwap(sr, sc, r, c); return; }
    selected = [r, c];
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'candy' + (selected && selected[0]===r && selected[1]===c ? ' sel' : '');
        if (grid[r][c] !== null) {
          const candy = CANDIES[grid[r][c]];
          cell.style.background = candy.bg;
          cell.textContent = candy.emoji;
        } else {
          cell.style.background = 'transparent';
        }
        cell.addEventListener('click', () => cellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  document.getElementById('vsComputer').addEventListener('click', () => startMatch('ai'));
  document.getElementById('vsFriend').addEventListener('click', () => startMatch('pvp'));
  document.getElementById('restart').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
