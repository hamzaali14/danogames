<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Simon Says — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<script src="../shared.js" defer></script>
<style>
  #pad { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(80vw, 300px); }
  .pad-btn {
    aspect-ratio: 1; border-radius: 16px; cursor: pointer; opacity: 0.55;
    transition: opacity .1s ease, transform .1s ease;
  }
  .pad-btn.lit { opacity: 1; transform: scale(0.96); }
  #p0 { background: #ff4fd8; border-top-left-radius: 100px; }
  #p1 { background: #a855f7; border-top-right-radius: 100px; }
  #p2 { background: #22d3ee; border-bottom-left-radius: 100px; }
  #p3 { background: #ffb84f; border-bottom-right-radius: 100px; }
  #center {
    position: absolute; width: 90px; height: 90px; border-radius: 50%;
    background: #0a0b14; border: 3px solid #12131f;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; pointer-events: none;
  }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">🎵 Simon Says</div>
    <div class="g-stats">Level <b id="level">0</b> Best <b id="best">0</b></div>
    <button class="g-btn ghost" id="restart">Restart</button>
  </div>
  <div class="g-stage">
    <div style="position:relative; display:flex; align-items:center; justify-content:center;">
      <div id="pad">
        <div class="pad-btn" id="p0"></div>
        <div class="pad-btn" id="p1"></div>
        <div class="pad-btn" id="p2"></div>
        <div class="pad-btn" id="p3"></div>
      </div>
      <div id="center">0</div>
    </div>
    <div class="g-overlay show" id="overlay">
      <h2 id="overTitle">Simon Says</h2>
      <p id="overMsg">Watch the sequence, then repeat it. It gets longer each round.</p>
      <button class="g-btn" id="again">Start</button>
    </div>
  </div>
  <div class="g-hint">Watch, then click the pads in the same order</div>
</div>
<script>
(function(){
  const pads = [document.getElementById('p0'),document.getElementById('p1'),document.getElementById('p2'),document.getElementById('p3')];
  const freqs = [329.63, 261.63, 220.00, 164.81];
  let audioCtx;
  let sequence, playerStep, level, best, accepting;

  best = parseInt(localStorage.getItem('dg_simon_best') || '0');
  document.getElementById('best').textContent = best;

  function beep(i, dur) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freqs[i];
      g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur/1000);
      o.stop(audioCtx.currentTime + dur/1000);
    } catch(e) {}
  }

  function lightPad(i, dur) {
    pads[i].classList.add('lit');
    beep(i, dur);
    setTimeout(() => pads[i].classList.remove('lit'), dur);
  }

  function reset() {
    sequence = []; level = 0; playerStep = 0; accepting = false;
    document.getElementById('level').textContent = level;
    document.getElementById('center').textContent = level;
    document.getElementById('overlay').classList.remove('show');
    nextRound();
  }

  function nextRound() {
    sequence.push(Math.floor(Math.random()*4));
    level = sequence.length;
    document.getElementById('level').textContent = level;
    document.getElementById('center').textContent = level;
    playerStep = 0;
    accepting = false;
    playSequence();
  }

  function playSequence() {
    let i = 0;
    const speed = Math.max(280, 550 - level*15);
    const interval = setInterval(() => {
      lightPad(sequence[i], speed*0.7);
      i++;
      if (i >= sequence.length) {
        clearInterval(interval);
        setTimeout(() => { accepting = true; }, speed);
      }
    }, speed);
  }

  function padClick(i) {
    if (!accepting) return;
    lightPad(i, 200);
    if (sequence[playerStep] !== i) return fail();
    playerStep++;
    if (playerStep === sequence.length) {
      accepting = false;
      setTimeout(nextRound, 700);
    }
  }

  function fail() {
    accepting = false;
    if (level - 1 > best) { best = level - 1; localStorage.setItem('dg_simon_best', best); document.getElementById('best').textContent = best; }
    document.getElementById('overTitle').textContent = 'Wrong sequence!';
    document.getElementById('overMsg').textContent = 'You reached level ' + (level - 1) + '. Best: ' + best;
    document.getElementById('again').textContent = 'Try Again';
    document.getElementById('overlay').classList.add('show');
  }

  pads.forEach((p, i) => p.addEventListener('click', () => padClick(i)));
  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
})();
</script>
</body>
</html>
