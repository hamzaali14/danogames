<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sky Hopper — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<script src="../shared.js" defer></script>
<style>
  #board { border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: linear-gradient(180deg, #1b2450, #3a2a63 60%, #57346b); }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">🐸 Sky Hopper</div>
    <div class="g-stats">Height <b id="score">0</b> Best <b id="best">0</b></div>
    <button class="g-btn ghost" id="restart">Restart</button>
  </div>
  <div class="g-stage">
    <canvas id="board" width="320" height="520"></canvas>
    <div class="g-overlay show" id="overlay">
      <h2 id="overTitle">Sky Hopper</h2>
      <p id="overMsg">Bounce from cloud to cloud and climb as high as you can. Springs launch you way up!</p>
      <button class="g-btn" id="again">Start</button>
    </div>
  </div>
  <div class="g-hint" data-touch="Hold the left or right side of the screen to steer">Arrow keys / A-D to steer · You bounce automatically</div>
</div>
<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const PW = 62, PH = 12, GRAV = 1500, JUMP = -720, SPRING = -1150, MOVE = 300;
  let hero, plats, height, running, lastT, steer, keys = {}, stars;
  let best = parseInt(localStorage.getItem('dg_skyhopper_best') || '0');
  document.getElementById('best').textContent = best;

  stars = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3 }));

  function makePlat(y) {
    const r = Math.random();
    const type = height > 600 && r < 0.18 ? 'move' : height > 1200 && r < 0.3 ? 'crumble' : 'normal';
    return { x: Math.random() * (W - PW), y, type, dir: Math.random() < 0.5 ? -1 : 1, spring: type === 'normal' && Math.random() < 0.08, gone: false };
  }

  function reset() {
    height = 0; running = true; steer = 0;
    hero = { x: W / 2 - 16, y: H - 120, vx: 0, vy: JUMP, w: 32, h: 32, face: 1 };
    plats = [{ x: W / 2 - PW / 2, y: H - 60, type: 'normal', dir: 1, spring: false, gone: false }];
    let y = H - 60;
    while (y > -40) { y -= 55 + Math.random() * 35; plats.push(makePlat(y)); }
    document.getElementById('score').textContent = 0;
    document.getElementById('overlay').classList.remove('show');
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;

    const dir = steer || ((keys.right ? 1 : 0) - (keys.left ? 1 : 0));
    hero.vx = dir * MOVE;
    if (dir) hero.face = dir;
    hero.x += hero.vx * dt;
    if (hero.x > W) hero.x = -hero.w;
    if (hero.x < -hero.w) hero.x = W;

    const prevBottom = hero.y + hero.h;
    hero.vy += GRAV * dt;
    hero.y += hero.vy * dt;

    plats.forEach(p => {
      if (p.type === 'move') { p.x += p.dir * 70 * dt; if (p.x < 0 || p.x > W - PW) p.dir *= -1; }
      if (p.gone) p.y += 400 * dt;
    });

    if (hero.vy > 0) {
      for (const p of plats) {
        if (p.gone) continue;
        const bottom = hero.y + hero.h;
        if (prevBottom <= p.y && bottom >= p.y && hero.x + hero.w - 6 > p.x && hero.x + 6 < p.x + PW) {
          hero.y = p.y - hero.h;
          if (p.spring && hero.x + hero.w / 2 > p.x + PW / 2 - 14 && hero.x + hero.w / 2 < p.x + PW / 2 + 14) hero.vy = SPRING;
          else hero.vy = JUMP;
          if (p.type === 'crumble') p.gone = true;
          break;
        }
      }
    }

    const limit = H * 0.42;
    if (hero.y < limit) {
      const shift = limit - hero.y;
      hero.y = limit;
      plats.forEach(p => p.y += shift);
      stars.forEach(s => { s.y += shift * 0.2; if (s.y > H) s.y -= H; });
      height += shift;
      document.getElementById('score').textContent = Math.floor(height / 10);
    }

    plats = plats.filter(p => p.y < H + 20);
    let top = Math.min(...plats.map(p => p.y));
    const gap = Math.min(55 + height / 60, 120);
    while (top > -40) { top -= gap + Math.random() * 30; plats.push(makePlat(top)); }

    if (hero.y > H) return gameOver();
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    const score = Math.floor(height / 10);
    if (score > best) { best = score; localStorage.setItem('dg_skyhopper_best', best); document.getElementById('best').textContent = best; }
    document.getElementById('overTitle').textContent = 'You Fell!';
    document.getElementById('overMsg').textContent = 'Height: ' + score + (score >= best && score > 0 ? ' — New best!' : '');
    document.getElementById('again').textContent = 'Play Again';
    document.getElementById('overlay').classList.add('show');
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); });
    plats.forEach(p => {
      ctx.fillStyle = p.type === 'move' ? '#22d3ee' : p.type === 'crumble' ? (p.gone ? 'rgba(201,138,75,0.5)' : '#c98a4b') : '#f2f3f8';
      roundRect(p.x, p.y, PW, PH, 6); ctx.fill();
      if (p.spring) { ctx.fillStyle = '#f5a524'; ctx.fillRect(p.x + PW / 2 - 8, p.y - 8, 16, 8); }
    });
    ctx.save();
    ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
    ctx.scale(hero.face, 1);
    ctx.font = '30px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🐸', 0, 2);
    ctx.restore();
  }

  function setSteer(clientX) {
    const rect = canvas.getBoundingClientRect();
    steer = clientX < rect.left + rect.width / 2 ? -1 : 1;
  }
  const activePointers = new Map();
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); activePointers.set(e.pointerId, e.clientX); setSteer(e.clientX); });
  canvas.addEventListener('pointermove', (e) => { if (activePointers.has(e.pointerId)) { activePointers.set(e.pointerId, e.clientX); setSteer(e.clientX); } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, (e) => {
    activePointers.delete(e.pointerId);
    if (activePointers.size) setSteer(Array.from(activePointers.values()).pop()); else steer = 0;
  }));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  height = 0;
  hero = { x: W / 2 - 16, y: H - 120, w: 32, h: 32, face: 1 };
  plats = [{ x: W / 2 - PW / 2, y: H - 60, type: 'normal', spring: false }];
  draw();
})();
</script>
</body>
</html>
