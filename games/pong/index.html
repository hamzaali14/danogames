<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pong — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<style>
  .g-stage { background: #0e0f1a; }
  #board { background: #12131f; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">🏓 Pong</div>
    <div class="g-stats">You <b id="youScore">0</b> AI <b id="aiScore">0</b> Wins <b id="wins">0</b></div>
    <button class="g-btn ghost" id="restart">Restart</button>
  </div>
  <div class="g-stage">
    <canvas id="board" width="480" height="320"></canvas>
    <div class="g-overlay" id="overlay">
      <h2 id="overTitle">Game Over</h2>
      <p id="overMsg">First to 7 wins.</p>
      <button class="g-btn" id="again">Play Again</button>
    </div>
  </div>
  <div class="g-hint">Mouse / touch to move, or Up-Down arrows / W-S · First to 7 wins</div>
</div>
<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const PW = 10, PH = 70, BALL_R = 7;
  let you, ai, ball, youScore, aiScore, wins, running, keys = {};

  wins = parseInt(localStorage.getItem('dg_pong_wins') || '0');
  document.getElementById('wins').textContent = wins;

  function reset() {
    you = { y: H/2 - PH/2 };
    ai = { y: H/2 - PH/2 };
    youScore = 0; aiScore = 0; running = true;
    document.getElementById('youScore').textContent = youScore;
    document.getElementById('aiScore').textContent = aiScore;
    document.getElementById('overlay').classList.remove('show');
    serve(Math.random() < 0.5 ? -1 : 1);
    loop();
  }

  function serve(dir) {
    ball = { x: W/2, y: H/2, vx: 4.2 * dir, vy: (Math.random()*4 - 2) };
  }

  function loop() {
    if (!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function update() {
    if (keys.up) you.y -= 6;
    if (keys.down) you.y += 6;
    you.y = Math.max(0, Math.min(H - PH, you.y));

    const aiCenter = ai.y + PH/2;
    const target = ball.y;
    ai.y += Math.max(-4.5, Math.min(4.5, target - aiCenter)) * 0.9;
    ai.y = Math.max(0, Math.min(H - PH, ai.y));

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - BALL_R < 0 || ball.y + BALL_R > H) ball.vy *= -1;

    if (ball.x - BALL_R < PW + 10 && ball.y > you.y && ball.y < you.y + PH && ball.vx < 0) {
      ball.vx *= -1.06;
      ball.vy += (ball.y - (you.y + PH/2)) * 0.12;
      ball.x = PW + 10 + BALL_R;
    }
    if (ball.x + BALL_R > W - PW - 10 && ball.y > ai.y && ball.y < ai.y + PH && ball.vx > 0) {
      ball.vx *= -1.06;
      ball.vy += (ball.y - (ai.y + PH/2)) * 0.12;
      ball.x = W - PW - 10 - BALL_R;
    }

    if (ball.x < 0) { aiScore++; document.getElementById('aiScore').textContent = aiScore; checkEnd() || serve(1); }
    else if (ball.x > W) { youScore++; document.getElementById('youScore').textContent = youScore; checkEnd() || serve(-1); }
  }

  function checkEnd() {
    if (youScore >= 7 || aiScore >= 7) {
      running = false;
      const won = youScore >= 7;
      if (won) { wins++; localStorage.setItem('dg_pong_wins', wins); document.getElementById('wins').textContent = wins; }
      document.getElementById('overTitle').textContent = won ? 'You Win! 🎉' : 'AI Wins';
      document.getElementById('overMsg').textContent = youScore + ' – ' + aiScore;
      document.getElementById('overlay').classList.add('show');
      return true;
    }
    return false;
  }

  function draw() {
    ctx.fillStyle = '#12131f';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.setLineDash([6, 10]);
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#a855f7';
    ctx.fillRect(10, you.y, PW, PH);
    ctx.fillStyle = '#ff4fd8';
    ctx.fillRect(W - PW - 10, ai.y, PW, PH);
    ctx.fillStyle = '#f2f3f8';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { keys.up = true; e.preventDefault(); }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { keys.down = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
  });

  function moveTo(clientY) {
    const rect = canvas.getBoundingClientRect();
    const scale = H / rect.height;
    const y = (clientY - rect.top) * scale;
    you.y = Math.max(0, Math.min(H - PH, y - PH/2));
  }
  canvas.addEventListener('mousemove', (e) => moveTo(e.clientY));
  canvas.addEventListener('touchmove', (e) => { moveTo(e.touches[0].clientY); e.preventDefault(); }, {passive:false});

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
