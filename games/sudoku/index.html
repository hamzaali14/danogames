<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sudoku — DanoGames</title>
<link rel="stylesheet" href="../shared.css">
<style>
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #board {
    display: grid; grid-template-columns: repeat(9, 1fr);
    width: min(90vw, 380px); aspect-ratio: 1;
    background: #0e0f1a; border: 2px solid rgba(255,255,255,0.18); border-radius: 8px;
    overflow: hidden;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(13px, 3.2vw, 18px); font-weight: 700;
    background: #171826; border: 1px solid rgba(255,255,255,0.05);
    color: #f2f3f8; cursor: pointer; user-select: none;
  }
  .cell.given { color: #9295ad; cursor: default; background: #12131f; }
  .cell.sel { background: rgba(168,85,247,0.35); }
  .cell.bad { color: #ff5c7c; }
  .cell:nth-child(3n) { border-right: 2px solid rgba(255,255,255,0.18); }
  .cell:nth-child(9n+1) { border-left: 2px solid rgba(255,255,255,0.18); }
  #board .cell:nth-child(n+19):nth-child(-n+27),
  #board .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid rgba(255,255,255,0.18); }
  #pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; width: min(90vw, 380px); }
  #pad button {
    aspect-ratio: 1; border: none; border-radius: 8px; background: #1e2032; color: #f2f3f8;
    font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  #pad button.erase { background: #2a2c40; font-size: 12px; }
  #pad button:active { filter: brightness(1.3); }
</style>
</head>
<body>
<div class="g-shell">
  <div class="g-hud">
    <div class="g-title">🔢 Sudoku</div>
    <div class="g-stats">Filled <b id="filled">0</b>/81 Mistakes <b id="mistakes">0</b></div>
    <button class="g-btn ghost" id="restart">New Puzzle</button>
  </div>
  <div class="g-stage">
    <div id="wrap">
      <div id="board"></div>
      <div id="pad"></div>
    </div>
    <div class="g-overlay" id="overlay">
      <h2 id="overTitle">Solved! 🎉</h2>
      <p id="overMsg">Nicely done.</p>
      <button class="g-btn" id="again">New Puzzle</button>
    </div>
  </div>
  <div class="g-hint">Tap a cell, then tap a number · Type 1-9 on keyboard</div>
</div>
<script>
(function(){
  const PUZZLES = [
    {
      given: [
        [5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],
        [8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],
        [0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]
      ],
      solution: [
        [5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],
        [8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],
        [9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]
      ]
    },
    {
      given: [
        [0,0,0,2,6,0,7,0,1],[6,8,0,0,7,0,0,9,0],[1,9,0,0,0,4,5,0,0],
        [8,2,0,1,0,0,0,4,0],[0,0,4,6,0,2,9,0,0],[0,5,0,0,0,3,0,2,8],
        [0,0,9,3,0,0,0,7,4],[0,4,0,0,5,0,0,3,6],[7,0,3,0,1,8,0,0,0]
      ],
      solution: [
        [4,3,5,2,6,9,7,8,1],[6,8,2,5,7,1,4,9,3],[1,9,7,8,3,4,5,6,2],
        [8,2,6,1,9,5,3,4,7],[3,7,4,6,8,2,9,1,5],[9,5,1,7,4,3,6,2,8],
        [5,1,9,3,2,6,8,7,4],[2,4,8,9,5,7,1,3,6],[7,6,3,4,1,8,2,5,9]
      ]
    }
  ];

  const boardEl = document.getElementById('board');
  const padEl = document.getElementById('pad');
  let puzzle, cells, values, selected, mistakes;

  function reset() {
    puzzle = PUZZLES[Math.floor(Math.random() * PUZZLES.length)];
    values = puzzle.given.map(row => row.slice());
    selected = null;
    mistakes = 0;
    document.getElementById('mistakes').textContent = mistakes;
    document.getElementById('overlay').classList.remove('show');
    renderBoard();
    renderPad();
    updateFilled();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let r = 0; r < 9; r++) {
      const rowCells = [];
      for (let c = 0; c < 9; c++) {
        const div = document.createElement('div');
        const isGiven = puzzle.given[r][c] !== 0;
        div.className = 'cell' + (isGiven ? ' given' : '');
        div.textContent = values[r][c] || '';
        if (!isGiven) div.addEventListener('click', () => select(r, c));
        boardEl.appendChild(div);
        rowCells.push(div);
      }
      cells.push(rowCells);
    }
  }

  function renderPad() {
    padEl.innerHTML = '';
    for (let n = 1; n <= 9; n++) {
      const btn = document.createElement('button');
      btn.textContent = n;
      btn.addEventListener('click', () => place(n));
      padEl.appendChild(btn);
    }
    const erase = document.createElement('button');
    erase.textContent = '⌫';
    erase.className = 'erase';
    erase.style.gridColumn = 'span 9';
    erase.addEventListener('click', () => place(0));
    padEl.appendChild(erase);
  }

  function select(r, c) {
    if (selected) cells[selected[0]][selected[1]].classList.remove('sel');
    selected = [r, c];
    cells[r][c].classList.add('sel');
  }

  function place(n) {
    if (!selected) return;
    const [r, c] = selected;
    values[r][c] = n;
    const cell = cells[r][c];
    cell.textContent = n || '';
    cell.classList.remove('bad');
    if (n && n !== puzzle.solution[r][c]) {
      cell.classList.add('bad');
      mistakes++;
      document.getElementById('mistakes').textContent = mistakes;
    }
    updateFilled();
    checkWin();
  }

  function updateFilled() {
    let count = 0;
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (values[r][c]) count++;
    document.getElementById('filled').textContent = count;
  }

  function checkWin() {
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (values[r][c] !== puzzle.solution[r][c]) return;
    document.getElementById('overMsg').textContent = 'Mistakes: ' + mistakes;
    document.getElementById('overlay').classList.add('show');
  }

  document.addEventListener('keydown', (e) => {
    if (!selected) return;
    if (e.key >= '1' && e.key <= '9') place(parseInt(e.key, 10));
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') place(0);
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
